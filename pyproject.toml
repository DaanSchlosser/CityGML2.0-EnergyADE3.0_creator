[project]
name = "citygml-energy"
version = "0.5.0"
description = "CityGML 2.0 + Energy ADE 3.0 creator — generate standards-compliant GML from flat JSON input."
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "lxml-stubs>=0.5",
    "xsdata[cli,lxml]>=24.0",
]
# City-scale workflow — BAG / 3DBAG / EP-online fetch + CityJSON parsing.
# Optional because the per-building RenoDAT pipeline does not need them.
city = [
    "requests>=2.32",
    "shapely>=2.0",
    "python-dotenv>=1.0",
    "flatgeobuf>=0.1",
]

# ── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "citygml_energy/bindings.py",  # auto-generated by xsdata; do not lint or format
]

[tool.ruff.lint]
# En-dash is intentional typography in docstrings/comments (numeric ranges, parenthetical
# clauses). Whitelist it so RUF002/RUF003 do not flag correct Unicode usage.
allowed-confusables = ["–"]

select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # use pathlib over os.path
    "PERF",   # performance anti-patterns
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line length handled by formatter
    "SIM108",  # ternary — readability preference
    "TC001",   # runtime-evaluated dataclass annotations need real imports
    "TC003",   # same — Mapping etc. used in signatures at runtime
    "RUF005",  # tuple concatenation is the established pattern in this codebase
    "PERF203", # try/except in loop is intentional in parser code
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]     # sys.path manipulation before imports
"examples/*" = ["E402"]  # same

[tool.ruff.lint.isort]
known-first-party = ["citygml_energy"]

# ── Pyright / Pylance ───────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingModuleSource = false

# The xsdata-generated bindings.py contains GML property-type classes with
# thousands of fields each (e.g. ValuePropertyType ~2300 lines). Pyright's
# per-symbol complexity heuristic bails on these, after which every call site
# of a bindings dataclass surfaces a phantom "No parameter named X" error.
# Suppress those two checks for the citygml_energy package (which constructs
# bindings dataclasses everywhere); tests/ and tools/ keep strict checking
# via the default execution environment below.
[[tool.pyright.executionEnvironments]]
root = "citygml_energy"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"

[[tool.pyright.executionEnvironments]]
root = "tools"

# Restrict analysis to first-party source. Without this, Pylance/Pyright walks
# the bundled KITModelViewer Python distribution, the .venv, and any reference
# data dirs — producing tens of thousands of irrelevant diagnostics in the
# VSCode sidebar.
include = [
    "citygml_energy",
    "tests",
    "tools",
    "examples",
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/.git",
    "KITModelViewer_V7.5_Build-3636",
    "Energy_ADE-3.0beta8",
    "generated",
    "build",
    "dist",
]

# ── Pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
