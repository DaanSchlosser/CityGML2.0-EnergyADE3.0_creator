[project]
name = "citygml-energy"
version = "0.5.0"
description = "CityGML 2.0 + Energy ADE 3.0 creator — generate standards-compliant GML from flat data input (JSON or Excel)."
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "lxml-stubs>=0.5",
]

# ── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # use pathlib over os.path
    "PERF",   # performance anti-patterns
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line length handled by formatter
    "SIM108",  # ternary — readability preference
    "TC001",   # runtime-evaluated dataclass annotations need real imports
    "TC003",   # same — Mapping etc. used in signatures at runtime
    "RUF005",  # tuple concatenation is the established pattern in input_catalog
    "PERF203", # try/except in loop is intentional in parser code
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]     # sys.path manipulation before imports
"examples/*" = ["E402"]  # same

[tool.ruff.lint.isort]
known-first-party = ["citygml_energy"]

# ── Pyright / Pylance ───────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingModuleSource = false

# ── Pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
