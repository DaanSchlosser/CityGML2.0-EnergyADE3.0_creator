[project]
name = "citygml2.0-energyade3.0-beta8-creator"
version = "1.1.0"
description = "CityGML 2.0 + Energy ADE 3.0 creator: generate standards-compliant GML from flat JSON input."
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    # Runtime dependency: the generated bindings import xsdata types
    # (xsdata.models.datatype) and the model is serialised with xsdata. The
    # ``[cli]`` codegen tooling stays in ``dev``; only the library is needed at
    # runtime. Required by both the per-building and city pipelines.
    "xsdata[lxml]>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "lxml-stubs>=0.5",
    "mypy>=1.15",
    "pyright>=1.1.380",
    "xsdata[cli,lxml]>=24.0",
]
# City-scale workflow: BAG / 3DBAG / EP-online fetch + CityJSON parsing.
# Optional because the per-building pipeline does not need them.
city = [
    "requests>=2.32",
    "shapely>=2.0",
    "python-dotenv>=1.0",
    "flatgeobuf>=0.1",
    # orjson is optional; absence falls back to stdlib json transparently
    # (see citygml_energy.city_builder.http.loads_json). Including it in the
    # default ``[city]`` set gives the 3× CityJSON-parse speedup out of the box.
    "orjson>=3.9",
]
# Faster EP-online CSV filtering via the columnar parser. Keeps the base
# ``[city]`` install lean; enable when you want the sub-second filtered
# parse path in eponline.py (see _parse_labels_with_polars).
city-fast = [
    "polars>=0.20",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["citygml_energy*"]

# ── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "citygml_energy/bindings.py",  # auto-generated by xsdata; do not lint or format
]

[tool.ruff.lint]
# En-dash (–) is intentional typography in docstrings/comments (numeric
# ranges, parenthetical clauses), the multiplication sign (×) is correct
# math notation in dimensions like "3×4 grid" or "10×10 metres", and the
# minus sign (−) is correct math notation in formulae like "Total − Σ
# child_opening". Whitelisting them stops RUF001/002/003 from flagging
# correct Unicode usage.
allowed-confusables = ["–", "×", "−"]

select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # use pathlib over os.path
    "PERF",   # performance anti-patterns
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line length handled by formatter
    "SIM108",  # ternary, readability preference
    "TC001",   # runtime-evaluated dataclass annotations need real imports
    "TC003",   # same as TC001; Mapping etc. used in signatures at runtime
    "RUF005",  # tuple concatenation is the established pattern in this codebase
    "PERF203", # try/except in loop is intentional in parser code
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]     # sys.path manipulation before imports
"examples/*" = ["E402"]  # same

[tool.ruff.lint.isort]
known-first-party = ["citygml_energy"]

# BuildContext is a frozen, slotted dataclass (city_builder/config.py), so
# constructing it as a default argument carries no mutable-default footgun.
# Tell B008 to treat it as immutable, allowing the builder signatures that
# take ``ctx: BuildContext = BuildContext()``.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["citygml_energy.city_builder.config.BuildContext"]

# ── Pyright / Pylance ───────────────────────────────────────────────────
# All top-level pyright settings go in the ``[tool.pyright]`` table below;
# execution-environment overrides are in the trailing
# ``[[tool.pyright.executionEnvironments]]`` tables. TOML parses arrays-of-
# tables greedily, so any ``include`` / ``exclude`` / ``extraPaths`` keys
# MUST appear before the first ``[[executionEnvironments]]`` table or the
# TOML parser attaches them to the last array element and Pyright rejects
# them as "unrecognized setting".
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingModuleSource = false
# Tests, tools, and examples import first-party packages from the repo
# root ("import citygml_energy", "from tools.validate_xsd import ..."),
# which Pyright does not auto-discover when invoked with scoped paths.
# ``extraPaths = ["."]`` puts the project root on the analysis path so
# those imports resolve the same way a ``pytest`` run would.
extraPaths = ["."]
# Restrict analysis to first-party source. Without this, Pyright walks
# the bundled KITModelViewer Python distribution, the .venv, and any
# reference data dirs, producing tens of thousands of irrelevant
# diagnostics in the VSCode sidebar.
include = [
    "citygml_energy",
    "tests",
    "tools",
    "examples",
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/.git",
    "KITModelViewer_V7.5.2_Build-3777",
    "Energy_ADE-3.0beta8",
    "generated",
    "build",
    "dist",
]

# The xsdata-generated bindings.py contains GML property-type classes with
# thousands of fields each (e.g. ValuePropertyType ~2300 lines). Pyright's
# per-symbol complexity heuristic bails on these, after which every call
# site of a bindings dataclass surfaces phantom "No parameter named X"
# errors. Suppress those three checks for every first-party root where we
# construct bindings dataclasses (the whole repo, basically). Tests, tools,
# and examples fall in the same boat because their fixtures build the same
# dataclasses directly.
[[tool.pyright.executionEnvironments]]
root = "citygml_energy"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "tools"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "examples"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportArgumentType = "none"

# ── Mypy ────────────────────────────────────────────────────────────────
# Mypy runs alongside Pyright. Both target the same first-party source;
# mypy adds parametric (flow-sensitive) type checking that Pyright's
# ``basic`` mode does not cover. Strictness is "standard" rather than
# ``--strict``: the generated bindings don't carry rich stubs, and
# tightening further here only buys noise.
[tool.mypy]
python_version = "3.12"
files = ["citygml_energy", "tests", "tools", "examples"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# The xsdata-generated bindings carry thousands of heavily-overloaded
# attribute signatures; mypy bails on them the same way pyright does.
# Skipping type-checking of that single module is the pragmatic approach;
# call sites in the rest of the package are checked as normal.
[[tool.mypy.overrides]]
module = "citygml_energy.bindings"
ignore_errors = true

# Test fixtures construct many bindings dataclasses and access optional
# attributes after ``assert`` narrowing that xsdata's fields do not model.
# Relaxing ``union-attr`` in tests silences the false positives without
# losing real signal in production code.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["union-attr", "attr-defined", "arg-type"]

# audit_silent_bugs.py is an lxml-heavy diagnostic script: it walks parsed GML
# where ``Element.find`` returns ``_Element | None`` and ``QName`` round-trips
# through ``str``. The Optional-narrowing noise outweighs the signal for a
# read-only audit that only ever runs against already-valid documents, so this
# one tool is type-checked leniently. The shipped ``citygml_energy`` package is
# not relaxed this way.
[[tool.mypy.overrides]]
module = "tools.audit_silent_bugs"
ignore_errors = true

# ── Pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
